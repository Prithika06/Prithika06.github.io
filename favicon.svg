<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="#07090e"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f1420" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Soundwave Bars -->
  <g fill="url(#cyanGrad)" filter="url(#glow)">
    <rect x="14" y="26" width="5" height="12" rx="2.5"/>
    <rect x="23" y="16" width="5" height="32" rx="2.5"/>
    <rect x="32" y="10" width="5" height="44" rx="2.5"/>
    <rect x="41" y="20" width="5" height="24" rx="2.5"/>
    <rect x="50" y="28" width="5" height="8" rx="2.5"/>
  </g>
</svg>
